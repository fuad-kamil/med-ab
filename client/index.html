<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Medresa Online Exam Portal — Secure exam platform for students and teachers" />
    <title>Medresa Exam Portal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script>
      // Prevent flash of wrong theme — runs before React loads
      (function() {
        var p = localStorage.getItem('theme') || 'system';
        var t = p === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : p;
        document.documentElement.classList.add(t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0c0a09' : '#f5f5f4');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
